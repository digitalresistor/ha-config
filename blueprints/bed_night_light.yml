blueprint:
  name: Bed Night Light
  description: >-
    Light the way when someone gets out of bed at night, and turn the light off
    again once they are back in bed.

    It runs in a night mode, and also while the optional sleep switch is off,
    so someone sleeping during the day (with the rest of the house in Home)
    gets the night light too.

    When one side of the bed becomes empty the light turns on
    in a dim color: at the shared brightness while someone else is still
    asleep (so they are not woken up), at the alone brightness otherwise. A
    side only counts as someone asleep once it has been occupied for the
    minimum time in bed. The light follows the bed while it is on (someone
    else getting up, or coming back), and turns off once everyone who got up
    is back in bed or after the maximum time. When the night mode ends (or the
    sleep switch is turned back on) it is left as it is for whatever takes
    over, such as a good morning routine.

    If an Adaptive Lighting switch is selected, the light is marked as manually
    controlled while it is on so Adaptive Lighting does not change its color or
    brightness, and released again afterwards.
  domain: automation
  author: Delta Regeer
  source_url: https://github.com/digitalresistor/ha-config/blob/main/blueprints/bed_night_light.yml
  input:
    bed_sides:
      name: Bed sides
      description: One occupancy sensor per side of the bed (on means someone is lying there).
      selector:
        entity:
          multiple: true
          filter:
            domain: binary_sensor
    light:
      name: Light
      selector:
        entity:
          filter:
            domain: light
    night_modes:
      name: Night modes
      description: Values of input_select.mode in which this runs.
      default:
        - Night
      selector:
        select:
          options:
            - Home
            - Away
            - Night
            - Movie
            - No Automation
          multiple: true
    sleep_switch:
      name: Sleep switch
      description: >-
        Optional. While this switch is off the night light runs in any mode,
        for example the room's automation switch turned off by a bedside
        remote when someone goes to sleep during the day.
      default: ""
      selector:
        entity:
          filter:
            domain:
              - input_boolean
              - switch
    color:
      name: Color
      default: [255, 0, 0]
      selector:
        color_rgb:
    brightness_alone:
      name: Brightness when nobody is in bed
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    brightness_shared:
      name: Brightness while someone is still in bed
      default: 25
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    settle_time:
      name: Settle time
      description: >-
        How long a side has to stay empty (or occupied) before it counts, to
        ignore someone shifting around.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
    min_occupied_time:
      name: Minimum time lying there
      description: >-
        A side only counts as someone getting up if it had been occupied this
        long before it became empty, so rolling over to the other side for a
        moment does not turn the light on.
      default: 60
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds
    min_in_bed_time:
      name: Minimum time in bed
      description: >-
        A side only counts as someone sleeping there once it has been occupied
        this long, so one person rolling over or lying across the middle is
        not mistaken for a second sleeper.
      default: 600
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    max_on_time:
      name: Maximum on time
      default: 1800
      selector:
        number:
          min: 60
          max: 7200
          unit_of_measurement: seconds
    adaptive_lighting_switch:
      name: Adaptive Lighting
      description: The main Adaptive Lighting switch that controls the light, if any.
      default: ""
      selector:
        entity:
          filter:
            domain: switch
            integration: adaptive_lighting

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    id: out_of_bed
    entity_id: !input bed_sides
    from: "on"
    to: "off"
    for:
      seconds: !input settle_time
  # A restart or reload ends a trip without turning the light off.
  - trigger: homeassistant
    id: cleanup
    event: start
  - trigger: event
    id: cleanup
    event_type: automation_reloaded

variables:
  bed_sides: !input bed_sides
  light: !input light
  night_modes: !input night_modes
  sleep_switch: !input sleep_switch
  color: !input color
  brightness_alone: !input brightness_alone
  brightness_shared: !input brightness_shared
  max_on_time: !input max_on_time
  min_occupied_time: !input min_occupied_time
  min_in_bed_time: !input min_in_bed_time
  adaptive_lighting_switch: !input adaptive_lighting_switch

# "Night" below means a night mode, or the sleep switch being off; the same
# check is repeated wherever it has to be re-evaluated.
conditions:
  - condition: template
    value_template: >-
      {{ states('input_select.mode') in night_modes
         or (sleep_switch != '' and is_state(sleep_switch, 'off')) }}
  # Rolling across the bed briefly occupies the other side; only a side that
  # someone was actually lying on counts as them getting up.
  - condition: template
    value_template: >-
      {{ trigger.id != 'out_of_bed'
         or (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
            >= min_occupied_time }}

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'cleanup' }}"
    then:
      - if:
          - condition: template
            value_template: "{{ is_state(light, 'on') }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ light }}"
      - stop: Cleaned up after restart or reload

  # Whoever just got up, plus everyone who had been in bed for the minimum
  # time, has to be back in bed before the light turns off.
  - variables:
      started: "{{ now().timestamp() }}"
      sleepers: >-
        {{ ([trigger.entity_id] + (expand(bed_sides)
             | selectattr('state', 'eq', 'on')
             | selectattr('last_changed', 'lt', now() - timedelta(seconds=min_in_bed_time))
             | map(attribute='entity_id') | list)) | unique | list }}
      brightness: 0
      done: false
  - if:
      - condition: template
        value_template: "{{ adaptive_lighting_switch != '' }}"
    then:
      - action: adaptive_lighting.set_manual_control
        continue_on_error: true
        data:
          entity_id: "{{ adaptive_lighting_switch }}"
          lights: "{{ [light] }}"
          manual_control: true

  - repeat:
      sequence:
        - variables:
            # Only sleepers count, so someone stirring is not taken for a
            # second person still asleep.
            in_bed: "{{ sleepers | select('is_state', 'on') | list }}"
            wanted: "{{ brightness_shared if in_bed else brightness_alone }}"
        - if:
            - condition: template
              value_template: "{{ wanted != brightness }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ light }}"
              data:
                rgb_color: "{{ color }}"
                brightness_pct: "{{ wanted }}"
            - variables:
                brightness: "{{ wanted }}"
        # Turning a light on can take a while; a wait_template also catches
        # changes to the bed that happened in the meantime.
        - wait_template: >-
            {{ sleepers | select('is_state', 'on') | list != in_bed
               or not (states('input_select.mode') in night_modes
                       or (sleep_switch != '' and is_state(sleep_switch, 'off'))) }}
          timeout:
            seconds: "{{ [max_on_time - (now().timestamp() - started), 0] | max | round(0) }}"
          continue_on_timeout: true
        # Let the bed settle so someone shifting around is ignored.
        - if:
            - condition: template
              value_template: >-
                {{ states('input_select.mode') in night_modes
                   or (sleep_switch != '' and is_state(sleep_switch, 'off')) }}
          then:
            - delay:
                seconds: !input settle_time
        - variables:
            done: >-
              {{ not wait.completed
                 or not (states('input_select.mode') in night_modes
                         or (sleep_switch != '' and is_state(sleep_switch, 'off')))
                 or sleepers | reject('is_state', 'on') | list | length == 0 }}
      until:
        - condition: template
          value_template: "{{ done }}"

  # Once the night has ended the light is left as it is for whatever takes
  # over (a good morning routine, Adaptive Lighting); it is only handed back
  # to Adaptive Lighting below.
  - if:
      - condition: template
        value_template: >-
          {{ states('input_select.mode') in night_modes
             or (sleep_switch != '' and is_state(sleep_switch, 'off')) }}
    then:
      - action: light.turn_off
        target:
          entity_id: "{{ light }}"
      # Only release Adaptive Lighting once the light reports off; a light
      # still reporting on would be adapted and turned straight back on.
      - wait_template: "{{ not is_state(light, 'on') }}"
        timeout: 10
      - delay:
          seconds: 1
  - if:
      - condition: template
        value_template: "{{ adaptive_lighting_switch != '' }}"
    then:
      - action: adaptive_lighting.set_manual_control
        continue_on_error: true
        data:
          entity_id: "{{ adaptive_lighting_switch }}"
          lights: "{{ [light] }}"
          manual_control: false
