blueprint:
  name: Motion-activated Lights
  description: Turn on a light when motion is detected
  domain: automation
  author: Zachary Priddy & Delta Regeer
  source_url: https://github.com/digitalresistor/ha-config/blob/main/blueprints/motion_activated_lights_always_on.yml
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    light_target:
      name: Lights
      default: {}
      selector:
        target:
          entity:
            domain:
              - light
    switch_target:
      name: Switches
      default: {}
      selector:
        target:
          entity:
            domain:
              - switch
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

# If motion is detected within the delay,
# we restart the script.
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    id: motion_start
    entity_id: !input motion_entity
    to: "on"
  - trigger: state
    id: motion_stop
    entity_id: !input motion_entity
    to: "off"
    for:
      seconds: !input no_motion_wait

variables:
  light_target: !input light_target
  switch_target: !input switch_target
  has_lights: "{{ light_target.values() | select | list | length > 0 }}"
  has_switches: "{{ switch_target.values() | select | list | length > 0 }}"

actions:
  - variables:
      action_service: "{{ 'turn_on' if trigger.id == 'motion_start' else 'turn_off' }}"
  - parallel:
      - alias: "Lights"
        if:
          - condition: template
            value_template: "{{ has_lights }}"
        then:
          - action: "light.{{ action_service }}"
            target: !input light_target
      - alias: "Switches"
        if:
          - condition: template
            value_template: "{{ has_switches }}"
        then:
          - action: "switch.{{ action_service }}"
            target: !input switch_target
