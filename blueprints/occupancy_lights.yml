blueprint:
  name: Occupancy-activated Lights
  description: >-
    Keep lights on while any motion/occupancy sensor detects someone, and for
    a while after a door opens or closes, or while a door is left open.

    Lights turn on when a sensor detects motion or a door opens/closes. They
    turn off once every sensor has been clear for the wait time and the door
    time has passed since the last door event. Motion keeps the lights on
    indefinitely, no matter how long it lasts, and so do doors in "Doors that
    keep lights on while open" for as long as they are open.

    Works with sensors that stay on for as long as someone is there (Eve,
    IKEA VALLHORN/MYGGSPRAY) and with sensors that report for a fixed time and
    retrigger (older IKEA TRADFRI). Only "on" counts as motion, so sensors
    that drop to unavailable between reports are treated as clear.

    If an Adaptive Lighting switch is selected, every light configured in that
    Adaptive Lighting instance is turned on/off by entity id, so Adaptive
    Lighting can adapt them as they turn on. The Adaptive Lighting instance
    needs "include_config_in_attributes" enabled so its light list can be read.
  domain: automation
  author: Delta Regeer
  source_url: https://github.com/digitalresistor/ha-config/blob/main/blueprints/occupancy_lights.yml
  input:
    motion_entities:
      name: Motion Sensors
      selector:
        entity:
          multiple: true
          filter:
            domain: binary_sensor
            device_class:
              - motion
              - occupancy
              - presence
    door_entities:
      name: Doors
      description: >-
        Doors, garage doors or covers. Each time one opens or closes the
        lights turn on for at least the door time.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - garage_door
                - opening
                - window
            - domain: cover
    hold_open_entities:
      name: Doors that keep lights on while open
      description: >-
        Doors, garage doors or covers that keep the lights on for as long as
        they are open, e.g. a garage door. Opening and closing them also counts
        as a door event, so the door time starts when they close.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - garage_door
                - opening
                - window
            - domain: cover
    automation_enabled:
      name: Automation Switch
      description: Leave empty to always run.
      default: ""
      selector:
        entity:
          filter:
            domain: input_boolean
    adaptive_lighting_switch:
      name: Adaptive Lighting
      description: >-
        The main Adaptive Lighting switch for the area (not the sleep mode,
        adapt color or adapt brightness switch). All of its lights are
        controlled by this automation.
      default: ""
      selector:
        entity:
          filter:
            domain: switch
            integration: adaptive_lighting
    light_target:
      name: Additional Lights
      description: Lights to control in addition to the Adaptive Lighting lights.
      default: {}
      selector:
        target:
          entity:
            domain: light
    switch_target:
      name: Switches
      default: {}
      selector:
        target:
          entity:
            domain: switch
    no_motion_wait:
      name: Wait time
      description: Time to leave the lights on after every sensor is clear.
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    door_time:
      name: Door time
      description: Time to leave the lights on after a door opens or closes, if there is no motion.
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

# Every sensor or door change restarts the run, which then works out from the
# current state how long the lights still need to stay on.
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    id: motion
    entity_id: !input motion_entities
    to: "on"
  - trigger: state
    id: motion_clear
    entity_id: !input motion_entities
    from: "on"
  - trigger: state
    id: door
    entity_id: !input door_entities
  - trigger: state
    id: door
    entity_id: !input hold_open_entities
  - trigger: homeassistant
    id: start
    event: start
  # Reloading automations (which saving one does) cancels a pending turn off.
  - trigger: event
    id: start
    event_type: automation_reloaded

variables:
  motion_entities: !input motion_entities
  door_entities: !input door_entities
  hold_open_entities: !input hold_open_entities
  automation_enabled: !input automation_enabled
  no_motion_wait: !input no_motion_wait
  door_time: !input door_time
  open_states: ["on", "open", "opening", "closing"]
  adaptive_lighting_switch: !input adaptive_lighting_switch
  adaptive_lighting_lights: >
    {{ (state_attr(adaptive_lighting_switch, 'configuration') or {}).get('lights', [])
       if adaptive_lighting_switch else [] }}
  light_target: !input light_target
  switch_target: !input switch_target
  has_lights: "{{ light_target.values() | select | list | length > 0 }}"
  has_switches: "{{ switch_target.values() | select | list | length > 0 }}"

conditions:
  - condition: template
    value_template: "{{ not automation_enabled or is_state(automation_enabled, 'on') }}"
  # A door event is a door opening, or closing after being open. Sensors
  # coming back from unavailable/unknown as closed are not. Covers only count
  # when they move (opening/closing): a garage door opener that reconnects
  # reports open/closed directly while it syncs.
  - condition: template
    value_template: >-
      {% set from = trigger.from_state.state if trigger.from_state else 'unknown' %}
      {% set to = trigger.to_state.state if trigger.to_state else 'unknown' %}
      {{ trigger.id != 'door'
         or (to in ['opening', 'closing'] if trigger.entity_id.startswith('cover.')
             else (to in open_states
                   or (from in open_states and to not in ['unavailable', 'unknown']))) }}

actions:
  - if:
      - condition: template
        value_template: "{{ adaptive_lighting_switch and not adaptive_lighting_lights }}"
    then:
      - stop: >-
          No lights found on the Adaptive Lighting switch, make sure it is the
          main switch and include_config_in_attributes is enabled.
        error: true

  - if:
      - condition: template
        value_template: "{{ trigger.id in ['motion', 'door'] }}"
    then:
      - parallel:
          - alias: "Turn on Adaptive Lighting Lights"
            if:
              - condition: template
                value_template: "{{ adaptive_lighting_lights | length > 0 }}"
            then:
              # Adaptive Lighting turns on the lights that are off itself, so they come
              # on at its brightness and color rather than their last state, and are not
              # taken as manually controlled.
              - if:
                  - condition: template
                    value_template: "{{ is_state(adaptive_lighting_switch, 'on') }}"
                then:
                  - variables:
                      lights_off: "{{ adaptive_lighting_lights | select('is_state', 'off') | list }}"
                  - if:
                      - condition: template
                        value_template: "{{ lights_off | length > 0 }}"
                    then:
                      - action: adaptive_lighting.apply
                        data:
                          entity_id: "{{ adaptive_lighting_switch }}"
                          lights: "{{ lights_off }}"
                          turn_on_lights: true
                          # Without this, apply fades over the regular transition (4 s by
                          # default) instead of the quicker one meant for lights turning on.
                          transition: "{{ (state_attr(adaptive_lighting_switch, 'configuration') or {}).get('initial_transition', 1) }}"
                      # Commands to many lights at once sometimes do not all arrive (some
                      # stay at their old, dim state). Check and send them again.
                      - repeat:
                          count: 2
                          sequence:
                            - delay:
                                seconds: 2
                            - variables:
                                missed: >-
                                  {%- set want = (state_attr(adaptive_lighting_switch, 'brightness_pct') | float(100)) * 2.55 -%}{%- set ns = namespace(lights=[]) -%}{%- for light in lights_off -%}{%- if not is_state(light, 'on') or state_attr(light, 'brightness') | float(0) < want * 0.8 -%}{%- set ns.lights = ns.lights + [light] -%}{%- endif -%}{%- endfor -%}{{ ns.lights }}
                            - if:
                                - condition: template
                                  value_template: "{{ missed | length > 0 }}"
                              then:
                                - action: adaptive_lighting.apply
                                  continue_on_error: true
                                  data:
                                    entity_id: "{{ adaptive_lighting_switch }}"
                                    lights: "{{ missed }}"
                                    turn_on_lights: true
                                    transition: "{{ (state_attr(adaptive_lighting_switch, 'configuration') or {}).get('initial_transition', 1) }}"
                else:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ adaptive_lighting_lights }}"
          - alias: "Turn on Additional Lights"
            if:
              - condition: template
                value_template: "{{ has_lights }}"
            then:
              - action: light.turn_on
                target: !input light_target
          - alias: "Turn on Switches"
            if:
              - condition: template
                value_template: "{{ has_switches }}"
            then:
              - action: switch.turn_on
                target: !input switch_target

  - alias: Wait until every sensor is clear and no door is held open
    wait_template: >-
      {{ motion_entities | select('is_state', 'on') | list | length == 0
         and hold_open_entities | select('is_state', open_states) | list | length == 0 }}

  # Sensors and doors only change state when something happens (or when they
  # drop to/return from unavailable, which can only make this longer), so the
  # most recent change is when they last saw activity.
  - variables:
      last_motion: "{{ expand(motion_entities) | map(attribute='last_changed') | max | default(now(), true) }}"
      last_door: >-
        {{ expand(door_entities + hold_open_entities) | map(attribute='last_changed')
           | max | default(none, true) }}
      motion_remaining: "{{ no_motion_wait - (now() - as_datetime(last_motion)).total_seconds() }}"
      door_remaining: >-
        {{ door_time - (now() - as_datetime(last_door)).total_seconds() if last_door else 0 }}
      remaining: "{{ [motion_remaining | float, door_remaining | float, 0] | max | round(0) }}"
  - delay:
      seconds: "{{ remaining }}"

  - parallel:
      - alias: "Turn off Adaptive Lighting Lights"
        if:
          - condition: template
            value_template: "{{ adaptive_lighting_lights | length > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ adaptive_lighting_lights }}"
      - alias: "Turn off Additional Lights"
        if:
          - condition: template
            value_template: "{{ has_lights }}"
        then:
          - action: light.turn_off
            target: !input light_target
      - alias: "Turn off Switches"
        if:
          - condition: template
            value_template: "{{ has_switches }}"
        then:
          - action: switch.turn_off
            target: !input switch_target
